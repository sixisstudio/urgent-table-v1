<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Urgent Table — Set Stage Position</title>
  <style>
    :root {
      --bg: #181a20;
      --fg: #e5e7eb;
      --fg-dim: #9ca3af;
      --accent: #f97316;
      --border: #2a2d36;
      --good: #22c55e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    body {
      display: flex;
      flex-direction: column;
      padding: 20px 24px;
      gap: 16px;
      border: 3px dashed var(--accent);
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }
    p {
      margin: 0;
      font-size: 13px;
      line-height: 1.55;
      color: var(--fg-dim);
    }
    .stage-rect {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--accent);
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-radius: 6px;
      border: 2px dashed var(--border);
      min-height: 80px;
    }
    .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    button {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      background: #20232b;
      color: var(--fg);
    }
    button:hover { background: #2a2d36; }
    button.primary {
      background: var(--good);
      color: #0a0a0a;
      border-color: var(--good);
      font-weight: 600;
    }
    button.primary:hover { background: #16a34a; }
    .footnote {
      font-size: 11px;
      color: var(--fg-dim);
    }
  </style>
</head>
<body>
  <h1>Stage position</h1>
  <p>
    Drag this window to where every urgent Hijack table should appear, then
    resize it to the size you want each table to be. When it's exactly where
    you want, click <strong>Save this position</strong>.
  </p>
  <div class="stage-rect">Urgent tables will appear here</div>
  <div class="actions">
    <button id="cancel">Cancel</button>
    <button id="save" class="primary">Save this position</button>
  </div>
  <div class="footnote" id="footnote">Stored as the current window's bounds. You can re-set anytime.</div>
  <script src="stage_placeholder.js"></script>
</body>
</html>
